services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NexusErpIdentity: Server=mysql;Port=3306;Database=nexus_erp_identity;User=nexus;Password=nexus_password;AllowPublicKeyRetrieval=True;SslMode=None
      ConnectionStrings__NexusErpHr: Server=mysql;Port=3306;Database=nexus_erp_hr;User=nexus;Password=nexus_password;AllowPublicKeyRetrieval=True;SslMode=None
      ConnectionStrings__NexusErpInventory: Server=mysql;Port=3306;Database=nexus_erp_inventory;User=nexus;Password=nexus_password;AllowPublicKeyRetrieval=True;SslMode=None
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: nexus
      MYSQL_PASSWORD: nexus_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_password || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql-data:
